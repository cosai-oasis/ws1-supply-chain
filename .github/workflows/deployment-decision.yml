name: Deployment decision experiment
on:
  pull_request:
    paths:
      - 'contributions/deployment-decision/**'
      - '.github/workflows/deployment-decision.yml'
  push:
    paths:
      - 'contributions/deployment-decision/**'
      - '.github/workflows/deployment-decision.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - node: '22'
            python: '3.11'
          - node: '24'
            python: '3.13'
    defaults:
      run:
        working-directory: contributions/deployment-decision
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: python -m pip install -r requirements.txt
      - run: python test_interop.py
      - run: python test_mutations.py
